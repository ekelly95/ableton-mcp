name: tests

# Pushes to main and pull requests only: tags and feature-branch pushes used
# to start a second, identical run of the same commit. Run by hand from the
# Actions tab (workflow_dispatch) when a branch needs CI before its PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ruff's verdict is platform- and interpreter-independent (target-version
  # is pinned in pyproject), so lint runs once instead of on all four legs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # --locked: install exactly uv.lock, and fail if it is out of date with
      # pyproject.toml, so CI runs the versions that were tested locally.
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The macOS job exercises the AF_UNIX client and control-surface paths;
        # the separate real-Live checkpoint covers Apple Silicon hardware.
        os: [windows-latest, macos-latest, ubuntu-latest]
        # 3.11 included because it is the interpreter Live embeds for the
        # control surface — the one version the shipped code must run on.
        python-version: ["3.11", "3.13"]
        # The newest Python pyproject allows (requires-python's upper bound),
        # on one OS — so a dependency without wheels for it shows up here
        # before users hit it.
        include:
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest
