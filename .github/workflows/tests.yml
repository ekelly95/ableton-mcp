name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS is in the matrix because it is the only machine that executes
        # the AF_UNIX transport paths (client and control surface) — no Mac
        # hardware exists in-house, so a green macos job is the macOS claim.
        os: [windows-latest, macos-latest]
        # 3.11 included because it is the interpreter Live embeds for the
        # control surface — the one version the shipped code must run on.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
