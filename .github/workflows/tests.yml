name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ruff's verdict is platform- and interpreter-independent (target-version
  # is pinned in pyproject), so lint runs once instead of on all four legs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The macOS job exercises the AF_UNIX client and control-surface paths;
        # the separate real-Live checkpoint covers Apple Silicon hardware.
        os: [windows-latest, macos-latest]
        # 3.11 included because it is the interpreter Live embeds for the
        # control surface — the one version the shipped code must run on.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
